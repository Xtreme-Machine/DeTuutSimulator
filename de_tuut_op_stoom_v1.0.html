<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211c18">
<title>De Tuut op Stoom · Een natte wacht</title>
<style>
:root {
  color-scheme: dark;
  --ink: #f5e8d2;
  --muted: #d4c3a9;
  --gold: #f0c485;
  --pale: #f6dbad;
  --floor: #191714;
  --panel: #26211c;
  --surface: #312921;
  --edge: #6c5845;
  --water: #a4d4ce;
  --warn: #ffd1ae;
  --safe: #b9d6a8;
  font: 16px/1.45 system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100svh;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% 0, #3a2c22, var(--floor) 70%);
}
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; }
button, summary { touch-action: manipulation; }
button {
  min-height: 44px;
  padding: 8px 14px;
  border: 1px solid var(--edge);
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--gold); background: #443629; }
button:active:not(:disabled) { translate: 0 1px; }
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 3px solid #ffdc9f; outline-offset: 3px; }
button.primary, button[aria-pressed="true"], button[aria-current="location"] {
  color: #221b13;
  background: var(--gold);
  border-color: var(--gold);
  font-weight: 650;
}
button.primary:hover:not(:disabled), button[aria-pressed="true"]:hover:not(:disabled), button[aria-current="location"]:hover:not(:disabled) {
  background: #ffdb9f;
}
.quiet { background: #231f1a; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}
.wrap { width: min(100%, 1200px); margin: auto; padding: 16px clamp(10px, 3vw, 32px) 22px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.topbar .options { margin-inline-start: auto; }
.wordmark { color: var(--pale); font: 500 clamp(1.17rem, 3vw, 1.62rem)/1.05 Georgia, serif; }
.options, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.options { font-size: .86rem; justify-content: end; }
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: clamp(295px, 43vw, 445px);
  display: flex;
  align-items: end;
  border: 1px solid var(--edge);
  border-radius: 12px;
  background: #454743;
}
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 65% 50%; z-index: -2; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, #161a17f5, #181a16b5 38%, #171b1844 67%, transparent), linear-gradient(0deg, #171715ce, transparent 65%); }
.hero-intro { padding: clamp(22px, 5vw, 60px); }
.hero h1 { max-width: 10ch; font-size: clamp(2.85rem, 8vw, 6rem); letter-spacing: -.064em; line-height: .88; }
.hero p { color: var(--gold); font: 500 clamp(1.15rem, 3vw, 1.8rem)/1.2 Georgia, serif; margin-top: 15px; }
.duty-heading { margin: 24px 0 8px; font-size: clamp(1.5rem, 3vw, 2rem); }
.duties { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.duty {
  text-align: left; min-height: 94px; padding: 12px 15px;
  display: grid; align-content: center; gap: 4px;
  background: linear-gradient(122deg, #392e23, #25211b);
}
.duty span:first-child { color: var(--gold); font-size: .83rem; }
.duty strong { font: 500 clamp(1.05rem, 2.1vw, 1.45rem)/1.15 Georgia, serif; }
.game-head {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center;
  gap: 12px; padding: 12px 14px;
  border: 1px solid var(--edge); border-radius: 10px 10px 0 0; background: var(--panel);
}
.game-head .duty-name { color: var(--gold); font-size: .83rem; }
.game-head h1 { font-family: inherit; font-weight: 650; font-size: clamp(1rem, 2.5vw, 1.25rem); line-height: 1.2; }
.polder { padding: 3px 12px; border-left: 1px solid var(--edge); min-width: 125px; }
.polder small { display: block; color: var(--muted); font-size: .79rem; }
.polder strong { color: var(--water); font-size: .93rem; font-variant-numeric: tabular-nums; }
.stage {
  position: relative;
  isolation: isolate;
  width: 100%;
  aspect-ratio: 760 / 405;
  max-height: 62vh;
  min-height: 220px;
  background: #343a35;
  overflow: hidden;
  border-inline: 1px solid var(--edge);
}
.stage canvas { display: block; width: 100%; height: 100%; }
.instruments {
  position: absolute; inset: 10px 10px auto; display: flex; flex-wrap: wrap;
  align-items: flex-start; gap: 5px; pointer-events: none;
}
.reading {
  padding: 4px 8px;
  border: 1px solid #cfb58b66;
  border-radius: 5px;
  background: #241e18ed;
  color: var(--ink);
  font-size: clamp(.74rem, 1.7vw, .91rem);
  font-variant-numeric: tabular-nums;
  box-shadow: 0 2px 8px #0006;
}
.reading.alert { background: #523124; color: #fff0d7; border-color: #ce9b74; }
.work-tools { position: absolute; inset: 0; pointer-events: none; }
.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  min-height: 44px;
  white-space: nowrap;
  background: #29221beb;
  border-color: #cfab79;
  color: #fff3dc;
  box-shadow: 0 3px 12px #0008;
  font-size: clamp(.78rem, 1.85vw, .98rem);
  padding-inline: clamp(7px, 1.8vw, 13px);
}
.hotspot[data-drag], #feed-wheel { touch-action: none; }
.nav {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 5px; padding: 7px; background: #231e18;
  border: 1px solid var(--edge);
}
.nav button { text-align: center; }
.nav button span { display: inline-block; }
.bench {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px;
  align-items: center; padding: 10px 13px; background: var(--panel);
  border: 1px solid var(--edge); border-top: 0; border-radius: 0 0 10px 10px;
}
.bench-content { display: grid; gap: 9px; }
.bench .actions { gap: 5px; }
.bench button { font-size: .92rem; }
.message { min-height: 1.45em; color: var(--pale); font-size: .93rem; }
.warning { color: var(--warn); font-size: .9rem; border-left: 3px solid #db9b71; padding-left: 8px; }
.closeup { background: #211c17; color: var(--pale); }
.overlay {
  position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; overflow: auto;
  padding: 16px; background: #14120fc9;
}
.dialog {
  width: min(100%, 500px); display: grid; gap: 13px;
  padding: clamp(18px, 5vw, 32px); color: var(--ink);
  border: 1px solid #ab8f68; border-radius: 12px; background: #30271e;
  box-shadow: 0 16px 60px #0009;
}
.dialog h2 { color: var(--pale); font-size: clamp(1.6rem, 6vw, 2.25rem); line-height: 1.07; }
.dialog p { color: var(--muted); }
.dialog .outcome { color: var(--safe); font-size: .9rem; }
.dialog .actions { margin-top: 3px; }
@media (max-width: 650px) {
  .topbar { gap: 6px; }
  .options { gap: 4px; }
  .options button { padding-inline: 7px; }
  .duties { grid-template-columns: 1fr; gap: 6px; }
  .duty { min-height: 64px; }
  .game-head { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 8px; padding: 8px 10px; }
  .polder { grid-column: 1; grid-row: 2; border: 0; padding: 0; min-width: 0; }
  .polder small { display: inline; margin-right: 5px; }
  .polder strong { font-size: .82rem; }
  #pause { grid-column: 2; grid-row: 1 / span 2; }
  .stage { min-height: 235px; max-height: 60vh; }
  .nav button { padding-inline: 4px; font-size: .9rem; }
  .bench { grid-template-columns: 1fr; }
  .bench > .actions { justify-content: end; }
}
@media (min-width: 651px) and (max-height: 600px) { .stage { max-height: 56vh; } }
@media (max-width: 380px) {
  .wordmark { max-width: 9ch; }
  .options button { font-size: .79rem; }
}
@media (prefers-reduced-motion: reduce) {
  button:active:not(:disabled) { translate: none; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="topbar">
    <span class="wordmark" id="wordmark" hidden>De Tuut op Stoom</span>
    <div class="options">
      <button type="button" id="sound" class="quiet" aria-pressed="false">Geluid uit</button>
      <button type="button" id="motion" class="quiet" aria-pressed="false">Minder beweging</button>
    </div>
  </header>
  <section id="menu">
    <div class="hero">
      <canvas id="cover" width="1000" height="480" aria-hidden="true"></canvas>
      <div class="hero-intro"><h1>De Tuut op Stoom</h1><p>Een natte wacht</p></div>
    </div>
    <h2 class="duty-heading">Kies je dienst</h2>
    <div class="duties" id="duties"></div>
  </section>
  <section id="game" hidden aria-label="De dienst">
    <header class="game-head">
      <div><p class="duty-name" id="duty-name"></p><h1 id="goal"></h1></div>
      <div class="polder"><small>Polderpeil</small><strong id="polder"></strong></div>
      <button type="button" id="pause" class="quiet" aria-keyshortcuts="Escape">Pauze</button>
    </header>
    <div class="stage" id="stage">
      <canvas id="scene" width="760" height="405" aria-hidden="true"></canvas>
      <div class="instruments" id="instruments"></div>
      <div class="work-tools" id="tools" aria-label="Bediening op de werkplek"></div>
    </div>
    <nav class="nav" id="places" aria-label="Werkplekken">
      <button type="button" data-place="grate">Krooshek</button>
      <button type="button" data-place="boiler">Ketelhuis</button>
      <button type="button" data-place="machine">Machinekamer</button>
    </nav>
    <div class="bench">
      <div class="bench-content">
        <div id="bench-controls" class="actions" hidden></div>
        <p id="warning" class="warning" role="alert" hidden></p>
        <p id="message" class="message" role="status"></p>
      </div>
      <div class="actions">
        <button type="button" id="help" class="quiet">Hulp</button>
      </div>
    </div>
  </section>
</main>
<div id="overlay" class="overlay" hidden>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <p class="outcome" id="dialog-kicker" hidden></p>
    <h2 id="dialog-title" tabindex="-1"></h2>
    <p id="dialog-body"></p>
    <div class="actions" id="dialog-actions"></div>
  </section>
</div>
<script>
"use strict";
const lessons = [
  { title: "Ruim baan voor het water", intro: "De machine draait, maar buiten komt het water amper door het krooshek. Kijk wat er voor de spijlen ligt.", view: "grate", time: "2–3 min", inflow: 160 },
  { title: "Houd het gemaal op stoom", intro: "Het vliegwiel draait al. Kijk of er ook water naar de Maas stroomt.", view: "machine", time: "3–4 min", inflow: 161 },
  { title: "De wacht is van jou", intro: "Het gemaal is koud. Breng de ketel op stoom en bereid intussen de machine voor.", view: "fire", time: "4–6 min", inflow: 162 }
];
const zone = { low: 56, high: 72 };
const debris = [
  { name: "Riet", resistance: 0.15 },
  { name: "Tak", resistance: 0.38 },
  { name: "Blad", resistance: 0.06 }
];
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const approach = (value, target, rate, dt) => value + (target - value) * Math.min(1, rate * dt);
const steadyWater = s => s.boiler >= 48 && s.boiler <= 73;
const clog = s => debris.reduce((total, piece, index) => total + (s.cleared[index] ? 0 : piece.resistance), 0);

function newGame(level) {
  const cold = level === 2;
  return {
    level, time: 0, peil: level === 0 ? 80 : 83, river: 88, flow: 0, inflow: lessons[level].inflow, trend: 0,
    cleared: level === 0 ? [false, false, false] : [true, true, true], boiler: level === 0 ? 49 : 63,
    fuel: cold ? 0.06 : level === 0 ? 0.84 : 0.52, heat: cold ? 0.04 : level === 0 ? 0.84 : 0.52,
    fresh: 0, temperature: cold ? 18 : 165, pressure: cold ? 0 : 9.6, relief: 0, feed: level === 0 ? 0 : 1,
    valve: !cold, rpm: cold ? 0 : 192, vacuum: cold ? 0 : 0.78, angle: cold ? 0 : 0.65,
    cooling: true, warm: false, drain: false, cylinder: cold ? 18 : 86, condensate: cold ? 0.27 : 0.04,
    oil: cold ? 0 : 1, fill: level === 0 ? 1 : 0, venturi: false, scoop: false,
    airLeak: false, incident: false, repaired: false, repair: 0, checkpoint: null, pumping: 0,
    waterManaged: false, pressureDip: false, everFilled: level === 0,
    coalCount: 0, criticalWater: 0, criticalPressure: 0, supportWater: false,
    check: null, result: "", assisted: false
  };
}

function preflight(s) {
  if (s.pressure < 5.5) return "De druk is nog te laag. Kijk naar de ketel.";
  if (s.boiler < 25) return "Het ketelwater staat te laag. Vraag de collega te helpen.";
  if (s.cylinder < 60) return "De cilinder is nog koud. Open de voorwarming.";
  if (s.condensate > 0.14) return "Er zit nog water in de cilinder. Open de condenswaterkraan.";
  if (s.warm || s.drain) return "Sluit de voorwarming en de condenswaterkraan vóór het starten.";
  if (s.oil < 0.3) return "Smeer de machine vóór je start.";
  if (Math.abs(Math.sin(s.angle)) < 0.18) return "Het wiel staat op een dood punt. Torn het een stukje.";
  return "";
}

function updateBoiler(s, dt) {
  if (s.level === 0) s.fuel = approach(s.fuel, 0.87, 0.22, dt);
  s.fresh = Math.max(0, s.fresh - 0.052 * dt);
  if (s.level > 0) s.fuel = Math.max(0.035, s.fuel - (0.00020 + 0.00045 * s.heat) * dt);
  const smother = clamp((s.fresh - 0.53) * 3, 0, 0.62);
  s.heat = approach(s.heat, s.fuel * (1 - smother), 1.1, dt);
  if (s.supportWater) {
    s.boiler = Math.min(49, s.boiler + 5 * dt);
    s.supportWater = s.boiler < 49;
  }
  if (s.temperature < 100) {
    s.temperature = clamp(s.temperature + (11 * s.heat - 0.013 * (s.temperature - 18)) * dt, 18, 100);
    return;
  }
  const load = s.flow / 220;
  const steam = s.valve ? 0.21 + 0.48 * load : 0;
  const warming = s.warm ? 0.105 : 0;
  const ejector = s.venturi && s.pressure >= 3.5 ? 0.15 : 0;
  const release = clamp((s.pressure - 11.5) * 1.4, 0, 0.88);
  s.relief = release;
  const generation = 1.11 * s.heat * clamp(s.boiler / 20, 0, 1);
  s.pressure = clamp(s.pressure + (generation - steam - warming - ejector - release - 0.015 * s.pressure) * dt, 0, 16);
  s.temperature = approach(s.temperature, 100 + s.pressure * 6, 0.45, dt);
  const waterUsed = 0.08 * s.heat + 0.27 * (steam + warming + ejector) + 0.17 * release;
  const feed = [0, 0.257, 2.25][s.feed] * clamp(s.rpm / 174, 0, 1.08);
  s.boiler = clamp(s.boiler + (feed - waterUsed) * dt, 0, 98);
  if (s.level < 2 && s.boiler < 31) {
    s.boiler = Math.max(31, s.boiler);
    s.assisted = true;
  }
}

function updateMachine(s, dt) {
  const heating = (s.warm || s.valve) && s.pressure >= 1.2;
  s.cylinder = approach(s.cylinder, heating ? 98 : 18, heating ? 0.225 : 0.0022, dt);
  if (heating && s.cylinder < 72) s.condensate += dt * (72 - s.cylinder) / 1250;
  if (s.drain) s.condensate -= 0.21 * dt;
  s.condensate = clamp(s.condensate, 0, 1);
  const coolingEffect = s.cooling && s.rpm > 10 ? 0.84 * clamp(s.rpm / 125, 0, 1) : 0;
  s.vacuum = approach(s.vacuum, coolingEffect, 0.34, dt);
  const steamPower = clamp((s.pressure - 3.0) / 5.2, 0, 1);
  const target = s.valve ? steamPower * (146 + 69 * s.vacuum) * (1 - 0.14 * s.flow / 220)
    * (s.boiler > 91 ? 0.88 : 1) : 0;
  s.rpm = approach(s.rpm, target, target ? 0.86 : 1.55, dt);
  if (s.rpm < 1) s.rpm = 0;
  s.angle = (s.angle + s.rpm * Math.PI / 30 * dt) % (Math.PI * 2);
  if (s.valve && s.level === 2) s.oil = Math.max(0.34, s.oil - 0.0012 * dt);
}

function updatePump(s, dt) {
  if (s.venturi && s.pressure >= 3.5) s.fill += 0.23 * dt;
  if (s.airLeak) s.fill -= 0.21 * dt;
  s.fill = clamp(s.fill, 0, 1);
  const requiredHead = Math.max(1.35, 2.13 + (s.river - 64) * 0.015 + (64 - s.peil) * 0.065);
  const availableHead = 4.65 * (s.rpm / 200) ** 2;
  const capacity = Math.min(245, 220 * Math.sqrt(Math.max(0, availableHead - requiredHead) / 2.4));
  s.flow = s.fill >= 0.96 && s.rpm > 1 ? capacity * (1 - clog(s)) : 0;
  s.everFilled ||= s.flow > 0;
  s.trend = approach(s.trend, (s.inflow - s.flow) * 0.018, 1.35, dt);
  s.peil = clamp(s.peil + (s.inflow - s.flow) * dt * 0.018, 0, 142);
}

function inZone(s) {
  return s.peil >= zone.low && s.peil <= zone.high;
}

function canFinish(s) {
  if (!s.valve || !s.flow || !inZone(s) || !steadyWater(s) || s.pressure < 7.8 || s.pressure >= 12.5 || s.venturi || s.feed !== 1) return false;
  if (s.level === 0) return clog(s) <= 0.061 && s.waterManaged;
  if (s.level === 1) return s.everFilled && s.coalCount > 0;
  return s.repaired;
}

function tick(s, dt) {
  if (s.result) return;
  s.time += dt;
  updateBoiler(s, dt);
  updateMachine(s, dt);
  updatePump(s, dt);
  s.pumping = s.flow > 0 ? s.pumping + dt : 0;
  s.pressureDip ||= s.everFilled && s.pressure < 8.3;
  if (s.repair > 0) {
    s.repair -= dt;
    if (s.repair <= 0) {
      s.airLeak = false;
      s.repaired = true;
    }
  }
  if (s.level === 2 && !s.incident && s.pumping >= 12 && inZone(s) && s.valve && s.pressure >= 7.8 && steadyWater(s)) {
    s.checkpoint = { ...s, cleared: s.cleared.slice(), check: null };
    s.incident = true;
    s.airLeak = true;
  }
  s.criticalWater = s.boiler < 23 && s.heat > 0.25 ? s.criticalWater + dt : 0;
  s.criticalPressure = s.pressure > 13.4 ? s.criticalPressure + dt : 0;
  if (s.level === 2 && (s.criticalWater >= 12 || s.criticalPressure >= 10)) {
    s.result = s.criticalWater >= 12 ? "water" : "pressure";
    s.valve = false;
    s.venturi = false;
    return;
  }
  if (!canFinish(s)) {
    s.check = null;
    return;
  }
  s.check ??= { time: 0, low: s.peil, high: s.peil };
  s.check.low = Math.min(s.check.low, s.peil);
  s.check.high = Math.max(s.check.high, s.peil);
  if (s.check.high - s.check.low > 1) s.check = { time: 0, low: s.peil, high: s.peil };
  else s.check.time += dt;
  if (s.check.time >= 5) s.result = "success";
}

function act(s, action, value) {
  switch (action) {
    case "rake":
      if (s.cleared[value]) return "";
      s.cleared[value] = true;
      if (clog(s) <= 0.061) return "Er stroomt weer genoeg water door het hek.";
      return value === 1 ? "De tak is los. Er stroomt veel meer water door de spijlen." : "Het vuil is los. Er stroomt wat meer water door.";
    case "scoop":
      s.scoop = !s.scoop;
      return s.scoop ? "De schep is vol. Breng de kolen naar de vuurdeur." : "Je hebt de schep teruggelegd.";
    case "coal":
      if (!s.scoop) return "Vul eerst de schep bij de kolenhoop.";
      s.scoop = false;
      s.coalCount++;
      s.fuel = clamp(s.fuel + 0.24, 0, 1);
      s.fresh = clamp(s.fresh + 0.24, 0, 0.95);
      return s.fresh > 0.56 ? "Veel verse kolen. Geef het vuur de tijd om aan te trekken." : "De kolen liggen op het vuur. De druk reageert geleidelijk.";
    case "feed":
      if (value === 1 && steadyWater(s)) s.waterManaged = true;
      s.feed = value;
      return ["Voeding dicht. De draaiende machine verbruikt nog stoom.", "Voeding op Normaal. Blijf het peilglas volgen.", s.rpm ? "Bijvullen. Kijk hoe het peil in het glas stijgt." : "De voeding staat open. De voedingspomp werkt zodra de machine draait."][value];
    case "helpWater":
      if (s.valve || s.rpm || s.boiler >= 30) return "";
      s.supportWater = true;
      return "De collega helpt met het ketelwater. Volg de waterlijn in het peilglas.";
    case "venturi":
      if (!s.venturi && (!s.valve || s.pressure < 3.5)) return "Laat de machine eerst draaien met voldoende stoomdruk.";
      s.venturi = !s.venturi;
      return s.venturi ? "De venturi zuigt lucht uit de pomp. Volg het pompglas." : s.fill < 0.96 ? "De venturi is dicht. Je kunt de pomp verder vullen." : "De venturi is dicht en de pomp is gevuld.";
    case "warm":
      s.warm = !s.warm;
      return s.warm ? "De cilinder warmt op zodra er stoom beschikbaar is." : "Voorwarming dicht.";
    case "drain":
      s.drain = !s.drain;
      return s.drain ? "Condenswater kan uit de cilinder." : "Condenswaterkraan dicht.";
    case "oil":
      s.oil = 1;
      return "De machine is gesmeerd.";
    case "turn":
      if (s.rpm || s.valve) return "Wacht tot het wiel stilstaat.";
      s.angle = (s.angle + 0.65) % (Math.PI * 2);
      return "Het vliegwiel is een stukje verzet.";

      completed: Array.isArray(data?.completed) ? data.completed.filter(level => Number.isInteger(level) && level >= 0 && level < lessons.length) : [] };
  } catch {
    return { sound: false, reduced: false, completed: [] };
  }
}

function savePreferences() {
  try { localStorage.setItem(storageKey, JSON.stringify(preferences)); } catch { /* Play remains available. */ }
}

function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

function makeButton(label, onClick, className = "") {
  const button = document.createElement("button");
  button.type = "button";
  button.className = className;
  button.textContent = label;
  if (onClick) button.addEventListener("click", onClick);
  return button;
}

function createSoundscape() {
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!Context) return null;
  const context = new Context();
  const master = context.createGain();
  master.gain.value = 0;
  master.connect(context.destination);
  const drum = context.createOscillator();
  const drumGain = context.createGain();
  const water = context.createGain();
  const throb = context.createOscillator();
  const throbGain = context.createGain();
  drum.frequency.value = 49;
  drumGain.gain.value = 0;
  drum.connect(drumGain).connect(master);
  throbGain.gain.value = 0;
  throb.connect(throbGain).connect(drumGain.gain);
  drum.start();
  throb.start();
  const buffer = context.createBuffer(1, context.sampleRate * 2, context.sampleRate);
  const samples = buffer.getChannelData(0);
  let noise = 0;
  for (let index = 0; index < samples.length; index++) {
    noise = noise * 0.61 + (Math.random() * 2 - 1) * 0.39;
    samples[index] = noise;
  }
  const stream = context.createBufferSource();
  const filter = context.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 1000;
  stream.buffer = buffer;
  stream.loop = true;
  stream.connect(filter).connect(water).connect(master);
  stream.start();
  return { context, master, drum, drumGain, throb, throbGain, water, filter };
}

function renderSound() {
  if (!soundscape) return;
  const { context, master, drum, drumGain, throb, throbGain, water, filter } = soundscape;
  const now = context.currentTime;
  const live = preferences.sound && mode === "playing";
  master.gain.setTargetAtTime(live ? 0.54 : 0, now, 0.065);
  if (!s || !live) return;
  const outside = view === "grate";
  const nearMachine = view === "machine";
  const rpm = clamp(s.rpm / 200, 0, 1);
  const pulse = rpm * (nearMachine ? 0.055 : 0.024);
  drum.frequency.setTargetAtTime(47 - s.flow / 240 * 8, now, 0.12);
  drumGain.gain.setTargetAtTime(pulse, now, 0.13);
  throbGain.gain.setTargetAtTime(pulse * 0.8, now, 0.13);
  throb.frequency.setTargetAtTime(Math.max(0.8, s.rpm / 60 * 2), now, 0.15);
  const fireNoise = view === "fire" ? s.heat * 0.025 : 0;
  water.gain.setTargetAtTime((outside ? 0.022 : 0.006) + s.flow / 220 * (outside ? 0.11 : 0.022) + fireNoise, now, 0.13);
  filter.frequency.setTargetAtTime(outside ? 760 + s.flow * 2.4 : 600, now, 0.1);
}

async function enableSound() {
  if (!preferences.sound) return;
  try {
    soundscape ??= createSoundscape();
    if (!soundscape) throw new Error("Audio unavailable");
    await soundscape.context.resume();
    renderSound();
  } catch {
    preferences.sound = false;
    savePreferences();
    renderPreferences();
  }
}

function actionSound(action) {
  if (!soundscape || !preferences.sound || mode !== "playing") return;
  const { context, master } = soundscape;
  const now = context.currentTime;
  const oscillator = context.createOscillator();
  const voice = context.createGain();
  const frequency = { rake: 115, coal: 91, scoop: 200, feed: 155, venturi: 227, machine: 105 }[action] || 176;
  oscillator.type = action === "coal" || action === "rake" ? "triangle" : "sine";
  oscillator.frequency.setValueAtTime(frequency, now);
  oscillator.frequency.exponentialRampToValueAtTime(frequency * 0.54, now + 0.13);
  voice.gain.setValueAtTime(0.07, now);
  voice.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);
  oscillator.connect(voice).connect(master);
  oscillator.onended = () => { oscillator.disconnect(); voice.disconnect(); };
  oscillator.start(now);
  oscillator.stop(now + 0.18);
}

function renderPreferences() {
  setText(ui.sound, preferences.sound ? "Geluid aan" : "Geluid uit");
  ui.sound.setAttribute("aria-pressed", String(preferences.sound));
  ui.motion.setAttribute("aria-pressed", String(preferences.reduced));
  visual.reduced = preferences.reduced || lessMotion.matches;
}

function resetFrame() {
  remainder = 0;
  lastFrame = performance.now();
}

function showDialog(title, body, actions, kicker = "") {
  if (ui.overlay.hidden) modalOrigin = document.activeElement;
  setText(ui["dialog-title"], title);
  setText(ui["dialog-body"], body);
  setText(ui["dialog-kicker"], kicker);
  ui["dialog-kicker"].hidden = !kicker;
  ui["dialog-actions"].replaceChildren(...actions.map(([text, handler], index) => makeButton(text, handler, index === 0 ? "primary" : "")));
  ui.overlay.hidden = false;
  document.querySelector("main").inert = true;
  ui["dialog-title"].focus();
}

function hideDialog(fallback) {
  ui.overlay.hidden = true;
  document.querySelector("main").inert = false;
  const focusTarget = modalOrigin?.isConnected && modalOrigin.getClientRects().length ? modalOrigin : fallback;
  focusTarget?.focus();
  modalOrigin = null;
}

function menu() {
  mode = "menu";
  ui.wordmark.hidden = true;
  ui.game.hidden = true;
  ui.menu.hidden = false;
  ui.duties.replaceChildren();
  lessons.forEach((lesson, index) => {
    const choose = makeButton("", () => openDuty(index), "duty");
    const number = document.createElement("span");
    const title = document.createElement("strong");
    number.textContent = "Dienst " + (index + 1) + (preferences.completed.includes(index) ? " · Voltooid" : " · " + lesson.time);
    title.textContent = lesson.title;
    choose.append(number, title);
    ui.duties.append(choose);
  });
  hideDialog(ui.duties.firstElementChild);
  renderSound();
}

function openDuty(level, checkpoint = null) {
  cancelDrag();
  s = checkpoint ? { ...checkpoint, cleared: checkpoint.cleared.slice(), checkpoint, incident: true, airLeak: true, result: "" } : newGame(level);
  if (!checkpoint && level === 0) updatePump(s, 0);
  mode = "ready";
  hints = { key: "", index: 0 };
  visual.coalAt = -100;
  visual.lifting = { index: -1, at: -100 };
  ui.menu.hidden = true;
  ui.wordmark.hidden = false;
  ui.game.hidden = false;
  setText(ui["duty-name"], "Dienst " + (level + 1) + " · " + lessons[level].title);
  setText(ui.message, "");
  switchView(checkpoint ? "machine" : lessons[level].view, false);
  showDialog(checkpoint ? "Het herstel opnieuw proberen" : lessons[level].title,
    checkpoint ? "De bemaling is op gang gekomen. Er verandert zo iets bij de pomp." : lessons[level].intro,
    [[checkpoint ? "Hervatten" : "Begin dienst", startPlaying], ["Alle diensten", menu]]);
}

function startPlaying() {
  mode = "playing";
  resetFrame();
  hideDialog(places.find(place => place.hasAttribute("aria-current")));
  render();
  enableSound();
}

function pause(hidden = false) {
  if (mode !== "playing") return;
  cancelDrag();
  mode = "paused";
  renderSound();
  showDialog("Dienst gepauzeerd", hidden ? "Je browservenster was uit beeld. De simulatie staat stil." : "Tijd, water en machine staan op dezelfde stand.",
    [["Hervatten", startPlaying], ["Begin opnieuw", () => openDuty(s.level)], ["Alle diensten", menu]]);
}

function finish() {
  cancelDrag();
  mode = "finished";
  renderSound();
  if (s.result !== "success") {
    const actions = s.checkpoint ? [["Herstel opnieuw", () => openDuty(s.level, s.checkpoint)]] : [];
    actions.push(["Begin opnieuw", () => openDuty(s.level)], ["Alle diensten", menu]);
    showDialog("Dienst afgebroken", s.result === "water"
      ? "Het water stond te lang onderin het peilglas. De collega heeft ingegrepen."
      : "De druk bleef te lang te hoog. De collega heeft ingegrepen.", actions);
    return;
  }
  if (!preferences.completed.includes(s.level)) preferences.completed.push(s.level);
  savePreferences();
  const actions = s.level + 1 < lessons.length ? [["Volgende dienst", () => openDuty(s.level + 1)]] : [["Alle diensten", menu]];
  actions.push(["Opnieuw spelen", () => openDuty(s.level)]);
  if (s.level + 1 < lessons.length) actions.push(["Alle diensten", menu]);
  const summary = [
    "Het hek laat weer genoeg water door en het ketelwater staat goed. De polder is op peil.",
    s.pressureDip ? "De pomp is gevuld. Door op tijd bij te stoken kreeg de machine weer genoeg stoom."
      : "De pomp is gevuld en je hield de stoomdruk op peil toen de machine harder moest werken.",
    "Je vond het lek, legde de machine stil en bracht de bemaling weer op gang. De volgende ploeg kan het overnemen."
  ][s.level];
  showDialog("Dienst gehaald", summary, actions, "Overdracht · polderpeil " + format.format(s.peil) + " cm");
}

function objective() {
  if (s.level === 0 && clog(s) > 0.061) return { key: "grate", text: "Laat het water door het hek stromen" };
  if (s.airLeak || s.repair > 0) {
    if (s.repair > 0) return { key: "leak", text: "Wacht tot de reparatie klaar is" };
    if (!s.valve && s.rpm) return { key: "leak", text: "Laat de machine uitlopen" };
    if (!s.valve) return { key: "leak", text: "Laat het lek dichten" };
    return { key: "leak", text: "Zoek waarom de afvoer wegvalt" };
  }
  if (!s.valve && s.boiler < 30) return { key: "feed", text: "Herstel het ketelwater voor het starten" };
  if (!s.valve) {
    if (s.pressure < 5.5) return { key: "fire", text: "Breng de ketel op stoom" };
    return { key: "start", text: s.repaired ? "Start de warme machine opnieuw" : "Maak de machine startklaar" };
  }
  if (s.fill < 0.96 && s.pressure < 3.5) return { key: "fire", text: "Herstel de stoomdruk" };
  if (s.fill < 0.96) return { key: "prime", text: "Zorg dat de pomp water levert" };
  if (s.venturi) return { key: "close", text: "Sluit de venturi bij het volle pompglas" };
  if (!steadyWater(s) || s.feed !== 1 || (s.level === 0 && !s.waterManaged)) {
    return { key: "feed", text: s.boiler < 48 ? "Breng het ketelwater op peil"
      : s.boiler > 73 ? "Laat het ketelwater zakken"
      : "Zet de voeding op Normaal" };
  }
  if (s.pressure < 7.8 || (s.level === 1 && !s.coalCount)) return { key: "fire", text: "Houd het vuur op sterkte" };
  if (s.check) return { key: "hold", text: "Het peil komt tot rust" };
  return { key: "hold", text: s.peil > zone.high ? "Bemaal de polder tot het peil goed staat" : "Houd de bemaling aan de gang" };
}

function getWarning() {
  if (s.boiler < 30) return "Ketelwater erg laag. Kijk direct bij het ketelhuis.";
  if (s.pressure > 12.4) return "Hoge druk. Laat het vuur afnemen en volg de drukmeter.";
  if (s.airLeak && !s.repair) return "Het pompglas verliest water en de afvoer valt weg.";
  if (s.boiler > 74) return "Ketelwater boven de bovenste markering. Zet de voeding lager.";
  if (s.valve && s.boiler < 48) return "Het ketelwater staat laag. Kijk naar het peilglas.";
  if (s.valve && s.pressure < 7.5) return "De stoomdruk loopt terug. Bekijk het vuur.";
  if (s.relief > 0.25) return "De veiligheidsklep laat stoom af.";
  return "";
}

function help() {
  const goal = objective();
  if (goal.key !== hints.key) hints = { key: goal.key, index: 0 };
  const options = {
    grate: ["Kijk waar het water tegen het krooshek blijft staan.", "Een groot stuk vuil houdt meer water tegen dan losse blaadjes.", "Trek de tak en het riet met de hark omhoog."],
    prime: ["Kijk in de machinekamer naar het pompglas.", "Het wiel draait, maar de pomp bevat nog lucht.", "Open de venturi en volg de waterlijn."],
    close: ["Het pompglas is vol.", "De pomp heeft de venturi nu niet meer nodig.", "Sluit de venturi. Het water blijft stromen."],
    feed: ["Bekijk het peilglas in het ketelhuis.", "Vergelijk de waterlijn met de twee strepen.", !s.valve && s.boiler < 30
      ? "Vraag de collega in het ketelhuis om hulp."
      : s.boiler > 73 ? "Draai de voeding terug. Zet haar op Normaal als het water weer tussen de strepen staat."
      : s.boiler < 48 ? "Zet het handwiel op Bijvullen. Zet het op Normaal zodra het peil goed staat."
      : "Zet de voeding op Normaal als de waterlijn tussen de strepen staat."],
    fire: ["Kijk naar het vuur en de drukmeter in het ketelhuis.", "Het vuur levert warmte. De druk reageert later.", "Vul de schep en breng één schep kolen naar de vuurdeur. Volg de reactie."],
    start: ["Bekijk de machinekamer.", "Controleer de stand van de voorbereidingskranen en de cilinder.", preflight(s) || "Open de hoofdstoomkraan om te starten."],
    leak: ["Kijk in de machinekamer naar het pompglas.", "Het glas raakt zijn water kwijt. De leiding laat lucht binnen.", "Leg de machine stil, laat het lek dichten en vul de pomp na de warme herstart."],
    hold: ["Kijk naar het polderpeil en de afvoer.", "Zolang er meer water weggaat dan erbij komt, daalt het peil.", "Laat het gemaal draaien en blijf druk en ketelwater volgen."]
  }[goal.key];
  setText(ui.message, options[Math.min(hints.index++, options.length - 1)]);
}

function cancelDrag() {
  const drag = visual.drag;
  const { id, target } = drag;
  drag.id = null;
  drag.target = null;
  drag.moved = false;
  if (id !== null && target?.hasPointerCapture?.(id)) target.releasePointerCapture(id);
}

function actionButton(action, label, parent, position = null, value = null) {
  const button = makeButton(label, () => {
    if (ignoreClick?.button === button && performance.now() < ignoreClick.until) return;
    perform(action, value);
  }, position ? "hotspot" : "");
  button.dataset.action = action;
  if (value !== null) button.dataset.value = String(value);
  if (position) {
    button.style.left = position[0] + "%";
    button.style.top = position[1] + "%";
  }
  parent.append(button);
  return button;
}

function switchView(next, focus = true) {
  cancelDrag();
  view = next;
  ui.tools.replaceChildren();
  ui["bench-controls"].replaceChildren();
  visual.rakeButtons = [];
  visual.scoopButton = null;
  const bench = ui["bench-controls"];
  if (view === "grate") {
    debris.forEach((piece, index) => {
      const button = actionButton("rake", piece.name, ui.tools, [34 + index * 17, 73], index);
      button.dataset.drag = "rake";
      button.setAttribute("aria-label", "Hark " + piece.name.toLowerCase() + " omhoog");
      visual.rakeButtons[index] = button;
    });
  } else if (view === "fire") {
    visual.scoopButton = actionButton("scoop", "Schep vullen", ui.tools, [19, 84]);
    visual.scoopButton.dataset.drag = "scoop";
    actionButton("coal", "Kolen op het vuur", ui.tools, [61, 79]);
    bench.append(makeButton("Naar het peilglas", () => switchView("water"), "closeup"));
  } else if (view === "water") {
    const wheel = actionButton("wheel", "Handwiel", ui.tools, [27, 65]);
    wheel.id = "feed-wheel";
    wheel.dataset.drag = "wheel";
    ["Dicht", "Normaal", "Bijvullen"].forEach((label, value) => actionButton("feed", label, bench, null, value));
    actionButton("helpWater", "Vraag collega om hulp", bench);
    bench.append(makeButton("Naar de vuurdeur", () => switchView("fire"), "closeup"));
  } else {
    actionButton("machine", "Hoofdstoomkraan", ui.tools, [35, 80]);
    actionButton("venturi", "Pomp vullen", ui.tools, [75, 70]);
    if (s.level === 2) {
      actionButton("warm", "Voorwarming", bench);
      actionButton("drain", "Condenswaterkraan", bench);
      actionButton("oil", "Smeren", bench);
      actionButton("turn", "Tornen", bench);
      actionButton("repair", "Lek laten dichten", bench);
    }
  }
  const room = view === "fire" || view === "water" ? "boiler" : view;
  for (const tab of places) {
    if (tab.dataset.place === room) tab.setAttribute("aria-current", "location");
    else tab.removeAttribute("aria-current");
  }
  bench.hidden = !bench.children.length;
  if (focus) {
    const first = Array.from(ui.tools.children).find(button => !button.disabled &&
      (button.dataset.action !== "rake" || !s.cleared[Number(button.dataset.value)]));
    (first || bench.querySelector("button"))?.focus();
  }
  render();
}

function perform(action, value = null) {
  if (mode !== "playing") return;
  if (action === "wheel") {
    action = "feed";
    value = s.feed === 2 ? 1 : s.feed + 1;
  }
  if (s.level === 0 && (action === "scoop" || action === "coal")) {
    setText(ui.message, "De collega zorgt tijdens deze dienst voor het vuur.");
    return;
  }
  const count = s.coalCount;
  const message = act(s, action, value);
  if (!message) return;
  if (action === "coal" && s.coalCount > count) visual.coalAt = s.time;
  if (action === "rake") {
    visual.lifting = { index: value, at: s.time };
    if (document.activeElement === visual.rakeButtons[value]) {
      const next = visual.rakeButtons.find((_, index) => !s.cleared[index]);
      (next || places[0]).focus();
    }
  }
  setText(ui.message, action === "rake" && clog(s) <= 0.061 && !s.waterManaged
    ? "Er stroomt weer genoeg water. Kijk nu naar het peilglas in het ketelhuis." : message);
  actionSound(action);
  render();
}

function showReadings(values) {
  while (ui.instruments.children.length > values.length) ui.instruments.lastElementChild.remove();
  values.forEach(([text, alert], index) => {
    let node = ui.instruments.children[index];
    if (!node) {
      node = document.createElement("span");
      ui.instruments.append(node);
    }
    node.className = alert ? "reading alert" : "reading";
    setText(node, text);
  });
}

function renderTools() {
  const stop = !s.valve && !s.rpm;
  const instrumentNames = ["Dicht", "Normaal", "Bijvullen"];
  for (const button of [...ui.tools.children, ...ui["bench-controls"].querySelectorAll("[data-action]")]) {
    const value = Number(button.dataset.value);
    switch (button.dataset.action) {
      case "rake": button.hidden = s.cleared[value]; break;
      case "scoop":
        setText(button, s.scoop ? "Schep terugleggen" : "Schep vullen");
        button.disabled = s.level === 0;
        break;
      case "coal": button.disabled = s.level === 0; break;
      case "wheel":
        setText(button, instrumentNames[s.feed]);
        button.setAttribute("aria-label", "Handwiel voeding, " + instrumentNames[s.feed]);
        break;
      case "feed": button.setAttribute("aria-pressed", String(s.feed === value)); break;
      case "helpWater": button.hidden = !stop || s.boiler >= 30; button.disabled = s.supportWater; break;
      case "machine": setText(button, s.valve ? "Machine stoppen" : "Machine starten"); break;
      case "venturi":
        setText(button, s.venturi ? "Venturi sluiten" : "Pomp vullen");
        button.disabled = !s.venturi && !s.valve;
        break;
      case "warm":
        setText(button, s.warm ? "Voorwarming sluiten" : "Voorwarmen");
        button.setAttribute("aria-pressed", String(s.warm));
        button.hidden = s.valve;
        break;
      case "drain":
        setText(button, s.drain ? "Condenswaterkraan sluiten" : "Ontwateren");
        button.setAttribute("aria-pressed", String(s.drain));
        button.hidden = s.valve;
        break;
      case "oil":
        setText(button, s.oil >= 0.3 ? "Opnieuw smeren" : "Smeren");
        button.hidden = s.valve;
        break;
      case "turn": button.hidden = s.valve; button.disabled = !stop; break;
      case "repair": button.hidden = !s.airLeak; button.disabled = !stop || s.repair > 0; break;
    }
  }
  const bench = ui["bench-controls"];
  bench.hidden = !Array.from(bench.children).some(button => !button.hidden);
}

function render() {
  if (!s || mode === "menu") return;
  const trend = s.trend > 0.14 ? "stijgt" : s.trend < -0.14 ? "daalt" : "stabiel";
  const zoneText = inZone(s) ? "op peil" : s.peil > zone.high ? "hoog" : "laag";
  setText(ui.polder, format.format(s.peil) + " cm · " + zoneText + " · " + trend);
  setText(ui.goal, objective().text);
  const warning = getWarning();
  ui.warning.hidden = !warning;
  setText(ui.warning, warning);
  const flow = Math.round(s.flow);
  if (view === "grate") {
    showReadings([["Afvoer " + flow + " m³/min"], ["Water erbij " + Math.round(s.inflow) + " m³/min"]]);
  } else if (view === "fire") {
    showReadings([
      [s.fresh > 0.56 ? "Veel verse kolen" : s.heat < 0.58 ? "Vuur zwak" : "Vuur brandt goed", s.heat < 0.42],
      [s.temperature < 100 ? "Ketel warmt op · " + Math.round(s.temperature) + " °C" : "Stoomdruk " + format.format(s.pressure) + " bar", s.valve && s.pressure < 7.5]
    ]);
  } else if (view === "water") {
    showReadings([["Ketelwater · " + (s.boiler < 48 ? "Laag" : s.boiler > 73 ? "Hoog" : "Op peil"), !steadyWater(s)]]);
  } else {
    const notes = [
      [s.valve && s.rpm > 1 ? "Vliegwiel draait" : s.rpm > 1 ? "Vliegwiel loopt uit" : "Vliegwiel stil"],
      [s.fill >= 0.96 ? "Pompglas vol" : "Pompglas " + Math.min(95, Math.round(100 * s.fill)) + "%"],
      ["Afvoer " + flow + " m³/min"]
    ];
    if (!s.valve && s.level === 2) {
      notes.push([s.cylinder < 60 ? "Cilinder koud" : "Cilinder warm"],
        [s.condensate > 0.14 ? "Condenswater aanwezig" : "Cilinder ontwaterd"],
        [s.pressure < 5.5 ? "Nog te weinig stoom voor start" : "Stoomdruk klaar voor start"]);
    }
    showReadings(notes);
  }
  renderTools();
  art(s, view, visual);
  renderSound();
}

for (const tab of places) {
  tab.addEventListener("click", () => {
    if (mode !== "playing") return;
    const place = tab.dataset.place;
    switchView(place === "boiler" ? (s.level === 0 || objective().key === "feed" ? "water" : "fire") : place);
  });
}

ui.stage.addEventListener("pointerdown", event => {
  const button = event.target.closest("[data-drag]");
  const drag = visual.drag;
  if (mode !== "playing" || !button || button.disabled || event.button !== 0 || drag.id !== null) return;
  drag.id = event.pointerId;
  drag.target = button;
  drag.startX = drag.x = event.clientX;
  drag.startY = drag.y = event.clientY;
  drag.moved = false;
  button.setPointerCapture(event.pointerId);
});
ui.stage.addEventListener("pointermove", event => {
  const drag = visual.drag;
  if (event.pointerId !== drag.id) return;
  drag.x = event.clientX;
  drag.y = event.clientY;
  drag.moved ||= Math.hypot(drag.x - drag.startX, drag.y - drag.startY) > 9;
});
ui.stage.addEventListener("pointerup", event => {
  const drag = visual.drag;
  if (event.pointerId !== drag.id) return;
  const from = drag.target;
  const dx = event.clientX - drag.startX;
  const dy = event.clientY - drag.startY;
  const moved = drag.moved || Math.hypot(dx, dy) > 9;
  const hit = document.elementFromPoint(event.clientX, event.clientY)?.closest("[data-action]");
  cancelDrag();
  if (!moved) return;
  ignoreClick = { button: from, until: performance.now() + 280 };
  if (from.dataset.drag === "rake" && dy < -22) perform("rake", Number(from.dataset.value));
  if (from.dataset.drag === "scoop" && hit?.dataset.action === "coal") {
    if (!s.scoop) perform("scoop");
    perform("coal");
  }
  if (from.dataset.drag === "wheel" && Math.max(Math.abs(dx), Math.abs(dy)) > 18) {
    perform("feed", clamp(s.feed + Math.sign(Math.abs(dx) >= Math.abs(dy) ? dx : -dy), 0, 2));
  }
});
ui.stage.addEventListener("pointercancel", cancelDrag);
ui.stage.addEventListener("lostpointercapture", event => { if (event.pointerId === visual.drag.id) cancelDrag(); });
ui.pause.addEventListener("click", () => pause());
ui.help.addEventListener("click", help);
ui.sound.addEventListener("click", () => {
  preferences.sound = !preferences.sound;
  savePreferences();
  renderPreferences();
  if (preferences.sound) enableSound();
  else renderSound();
});
ui.motion.addEventListener("click", () => {
  preferences.reduced = !preferences.reduced;
  savePreferences();
  renderPreferences();
  render();
});
lessMotion.addEventListener?.("change", () => { renderPreferences(); render(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(true); });
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && mode === "playing") {
    event.preventDefault();
    pause();
  } else if (event.key === "Escape" && mode === "paused") {
    event.preventDefault();
    startPlaying();
  } else if (event.key === "Tab" && !ui.overlay.hidden) {
    const buttons = Array.from(ui["dialog-actions"].querySelectorAll("button"));
    if (event.shiftKey && (document.activeElement === buttons[0] || document.activeElement === ui["dialog-title"])) {
      event.preventDefault();
      buttons.at(-1).focus();
    } else if (!event.shiftKey && document.activeElement === buttons.at(-1)) {
      event.preventDefault();
      buttons[0].focus();
    }
  }
});

function frame(now) {
  const elapsed = Math.max(0, Math.min(0.25, (now - lastFrame) / 1000));
  lastFrame = now;
  if (mode === "playing") {
    remainder += elapsed;
    while (remainder >= 0.05 && !s.result) {
      const leaking = s.airLeak;
      const repairing = s.repair > 0;
      const supported = s.assisted;
      tick(s, 0.05);
      remainder -= 0.05;
      if (!leaking && s.airLeak) setText(ui.message, "De afvoer verandert. Kijk wat er bij de pomp gebeurt.");
      if (repairing && s.repaired) setText(ui.message, "De leiding is hersteld. Je kunt de warme machine weer voorbereiden.");
      if (!supported && s.assisted) setText(ui.message, "De collega houdt het ketelwater laag maar veilig. Zet de voeding op Bijvullen.");
    }
    if (s.result) {
      render();
      finish();
    } else if (now - lastDraw > 32) {
      lastDraw = now;
      render();
    }
  }
  requestAnimationFrame(frame);
}

renderPreferences();
menu();
requestAnimationFrame(frame);
</script>
</body>
</html>
